name: Setup SSL vorlo.com.br

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Configura nginx + certbot pra vorlo.com.br
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            CONF=/etc/nginx/sites-available/crm

            # Backup antes de mexer.
            cp "$CONF" "$CONF.bak.$(date +%s)"

            # Idempotente: só adiciona o bloco se ainda não existir.
            if ! grep -q "server_name vorlo.com.br" "$CONF"; then
              cat >> "$CONF" <<'NGINXEOF'
            server {
                listen 80;
                server_name vorlo.com.br www.vorlo.com.br;

                client_max_body_size 30m;

                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;

                    proxy_buffer_size 32k;
                    proxy_buffers 8 32k;
                    proxy_busy_buffers_size 64k;
                }
            }
            NGINXEOF
              echo "bloco HTTP de vorlo.com.br adicionado."
            else
              echo "bloco de vorlo.com.br já existe, pulando inserção."
            fi

            echo "=== nginx -t (antes do certbot) ==="
            nginx -t
            systemctl reload nginx
            echo "=== HTTP funcionando (sanity antes do SSL) ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Host: vorlo.com.br" http://127.0.0.1/

            echo "=== rodando certbot (reusa conta ACME existente) ==="
            certbot --nginx -d vorlo.com.br -d www.vorlo.com.br --non-interactive --agree-tos --redirect

            echo "=== nginx -t (depois do certbot) ==="
            nginx -t
            systemctl reload nginx

            echo "=== resultado ==="
            certbot certificates 2>&1 | grep -A5 "vorlo.com.br"
