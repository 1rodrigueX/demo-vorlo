name: Diag (nginx/ssl)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ler nginx/certbot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== conteúdo COMPLETO de /etc/nginx/sites-available/crm ==="
            cat -A /etc/nginx/sites-available/crm 2>&1 | sed 's/\$$//' | cat -n
            echo "=== conta certbot registrada? ==="
            find /etc/letsencrypt/accounts -mindepth 3 -maxdepth 3 -type d 2>&1
            echo "=== www.vorlo.com.br resolve? ==="
            getent hosts www.vorlo.com.br 2>&1 || echo "não resolve"
            echo "=== nginx -t (sanity atual) ==="
            nginx -t 2>&1
