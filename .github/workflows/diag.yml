name: Diag (500 error)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ler logs e status do app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/crm
            echo "=== disco ==="
            df -h / 2>&1
            echo "=== memória ==="
            free -h 2>&1
            echo "=== conteúdo de .next (existe? tamanho?) ==="
            du -sh .next 2>&1 || echo "sem .next"
            ls -la .next 2>&1 | head -20
            echo "=== .next/server existe? ==="
            ls -la .next/server 2>&1 | head -10 || echo "sem .next/server"
