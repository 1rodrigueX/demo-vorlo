name: Diag (logs)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ler logs do PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/crm
            echo "=== pm2 describe ==="
            pm2 describe crm 2>&1 | grep -iE "script path|script args|exec cwd|exec mode|node.js version|status|restarts" || true
            echo "=== AUTH_SECRET len ==="
            awk -F= '/^AUTH_SECRET=/{print length($2)}' .env.local
            echo "=== DB vars em .env.local (mascarado) ==="
            grep -nE '^(DIRECT_URL|DATABASE_URL)=' .env.local | sed -E 's#://([^:]+):[^@]+@#://\1:****@#g'
            echo "=== lengths ==="
            awk -F= '/^DIRECT_URL=/{v=substr($0,index($0,"=")+1);print "DIRECT_URL len:",length(v)} /^DATABASE_URL=/{v=substr($0,index($0,"=")+1);print "DATABASE_URL len:",length(v)}' .env.local
            echo "=== ERROR log (30) ==="
            pm2 logs crm --err --lines 30 --nostream 2>&1 | tail -32 || true
