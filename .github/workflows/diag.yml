name: Fix - rebuild limpo

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild limpo e reinicia
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd /opt/crm
            echo "=== disco (antes) ==="
            df -h / 2>&1
            echo "=== removendo .next corrompido/incompleto ==="
            rm -rf .next
            echo "=== rebuild ==="
            npm run build
            echo "=== disco (depois) ==="
            df -h / 2>&1
            echo "=== restart ==="
            pm2 restart crm --update-env
            sleep 3
            echo "=== status ==="
            pm2 describe crm 2>&1 | grep -iE "status|restarts|uptime"
            echo "=== sanity local ==="
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3000/
