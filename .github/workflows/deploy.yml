name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          RUNTIME_DIRECT_URL: ${{ secrets.RUNTIME_DIRECT_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Encaminha os secrets do banco pro script remoto.
          envs: RUNTIME_DIRECT_URL,RUNTIME_DATABASE_URL
          script: |
            set -e
            # Áudio de voz do WhatsApp (convertToOggOpus) depende do ffmpeg do
            # sistema. Instala se estiver faltando, sem travar o deploy inteiro
            # se o apt falhar por algum motivo (é um recurso opcional, não vale
            # bloquear o pull/build/restart do app por causa disso).
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -y && sudo apt-get install -y ffmpeg || echo "aviso: não foi possível instalar o ffmpeg automaticamente"
            fi
            cd /opt/crm
            touch .env.local
            # Conexão com o banco (runtime). O pool usa DIRECT_URL (pooler de
            # sessão, 5432) — o certo pra processo longo. REESCREVE sempre a
            # partir do secret (remove valor antigo, que pode estar malformado),
            # entre aspas pra o dotenv não truncar num '#' da senha.
            sed -i '/^DIRECT_URL=/d;/^DATABASE_URL=/d' .env.local
            printf 'DIRECT_URL="%s"\n' "$RUNTIME_DIRECT_URL" >> .env.local
            printf 'DATABASE_URL="%s"\n' "$RUNTIME_DATABASE_URL" >> .env.local
            # Auth.js precisa de um segredo pra assinar a sessão (JWT). Gera uma
            # única vez e MANTÉM (o -q evita regenerar e invalidar as sessões de
            # todo mundo a cada deploy).
            grep -q '^AUTH_SECRET=' .env.local 2>/dev/null || echo "AUTH_SECRET=$(openssl rand -base64 32)" >> .env.local
            # Atrás do nginx, o Auth.js não descobre o host sozinho — fixa a URL.
            grep -q '^AUTH_URL=' .env.local 2>/dev/null || echo "AUTH_URL=https://falaai.cloud" >> .env.local
            grep -q '^AUTH_TRUST_HOST=' .env.local 2>/dev/null || echo "AUTH_TRUST_HOST=true" >> .env.local
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            # --update-env: pm2 relê as variáveis (senão mantém o env antigo em cache).
            pm2 restart crm --update-env
