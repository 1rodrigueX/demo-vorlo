name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          RUNTIME_DIRECT_URL: ${{ secrets.RUNTIME_DIRECT_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          RUNTIME_AUTH_GOOGLE_ID: ${{ secrets.RUNTIME_AUTH_GOOGLE_ID }}
          RUNTIME_AUTH_GOOGLE_SECRET: ${{ secrets.RUNTIME_AUTH_GOOGLE_SECRET }}
          RUNTIME_TURNSTILE_SITE_KEY: ${{ secrets.RUNTIME_TURNSTILE_SITE_KEY }}
          RUNTIME_TURNSTILE_SECRET_KEY: ${{ secrets.RUNTIME_TURNSTILE_SECRET_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Encaminha os secrets pro script remoto.
          envs: RUNTIME_DIRECT_URL,RUNTIME_DATABASE_URL,RUNTIME_AUTH_GOOGLE_ID,RUNTIME_AUTH_GOOGLE_SECRET,RUNTIME_TURNSTILE_SITE_KEY,RUNTIME_TURNSTILE_SECRET_KEY
          script: |
            set -e
            # Áudio de voz do WhatsApp (convertToOggOpus) depende do ffmpeg do
            # sistema. Instala se estiver faltando, sem travar o deploy inteiro
            # se o apt falhar por algum motivo (é um recurso opcional, não vale
            # bloquear o pull/build/restart do app por causa disso).
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -y && sudo apt-get install -y ffmpeg || echo "aviso: não foi possível instalar o ffmpeg automaticamente"
            fi
            cd /opt/crm
            touch .env.local
            # Conexão com o banco (runtime). O pool usa DIRECT_URL (pooler de
            # sessão, 5432) — o certo pra processo longo. REESCREVE sempre a
            # partir do secret (remove valor antigo, que pode estar malformado),
            # entre aspas pra o dotenv não truncar num '#' da senha.
            sed -i '/^DIRECT_URL=/d;/^DATABASE_URL=/d' .env.local
            printf 'DIRECT_URL="%s"\n' "$RUNTIME_DIRECT_URL" >> .env.local
            printf 'DATABASE_URL="%s"\n' "$RUNTIME_DATABASE_URL" >> .env.local
            # Auth.js precisa de um segredo pra assinar a sessão (JWT). Gera uma
            # única vez e MANTÉM (o -q evita regenerar e invalidar as sessões de
            # todo mundo a cada deploy).
            grep -q '^AUTH_SECRET=' .env.local 2>/dev/null || echo "AUTH_SECRET=$(openssl rand -base64 32)" >> .env.local
            # Atrás do nginx, o Auth.js não descobre o host sozinho — fixa a URL.
            grep -q '^AUTH_URL=' .env.local 2>/dev/null || echo "AUTH_URL=https://falaai.cloud" >> .env.local
            grep -q '^AUTH_TRUST_HOST=' .env.local 2>/dev/null || echo "AUTH_TRUST_HOST=true" >> .env.local
            # Login com Google (opcional) — só liga se os secrets existirem.
            if [ -n "$RUNTIME_AUTH_GOOGLE_ID" ]; then
              sed -i '/^AUTH_GOOGLE_ID=/d;/^AUTH_GOOGLE_SECRET=/d;/^NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=/d' .env.local
              printf 'AUTH_GOOGLE_ID="%s"\n' "$RUNTIME_AUTH_GOOGLE_ID" >> .env.local
              printf 'AUTH_GOOGLE_SECRET="%s"\n' "$RUNTIME_AUTH_GOOGLE_SECRET" >> .env.local
              echo 'NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=true' >> .env.local
            fi
            # Captcha (Cloudflare Turnstile, opcional) — só liga se os secrets existirem.
            if [ -n "$RUNTIME_TURNSTILE_SITE_KEY" ]; then
              sed -i '/^NEXT_PUBLIC_TURNSTILE_SITE_KEY=/d;/^TURNSTILE_SECRET_KEY=/d' .env.local
              printf 'NEXT_PUBLIC_TURNSTILE_SITE_KEY="%s"\n' "$RUNTIME_TURNSTILE_SITE_KEY" >> .env.local
              printf 'TURNSTILE_SECRET_KEY="%s"\n' "$RUNTIME_TURNSTILE_SECRET_KEY" >> .env.local
            fi
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            # --update-env: pm2 relê as variáveis (senão mantém o env antigo em cache).
            pm2 restart crm --update-env
