[package]
name = "synexa-desktop"
version = "0.1.0"
description = "App desktop da Synexa"
authors = ["Synexa"]
edition = "2021"

# O binário do app puxa a lib abaixo (padrão do template Tauri v2).
[lib]
name = "synexa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
