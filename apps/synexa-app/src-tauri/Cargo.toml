[package]
name = "synexa-app"
version = "0.1.0"
description = "App desktop da Vorlo"
authors = ["Vorlo"]
edition = "2021"

[lib]
name = "synexa_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
